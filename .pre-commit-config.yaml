repos:
  - repo: local
    hooks:
      - id: fix-guards
        name: Fix Header Guards
        entry: python3 scripts/fix_guards.py
        language: system
        types: [c++] # Looks for .cpp, .h, .inl etc
        files: \.(h|hpp|inl)$
      - id: clang-format
        name: Clang Format
        # No -style flag: the repo's .clang-format is the style, and passing
        # -style=google here silently ignored it.
        entry: clang-format -i
        language: system
        # .cc is the extension this repo actually uses; leaving it out meant
        # the hook covered almost nothing.
        files: \.(h|hpp|inl|cu|cc|cpp)$

      # Return types and variable naming are cpp_format's job, not a hook's:
      # it runs as a Bazel aspect over the whole graph (tools/cpp_format.sh
      # check|diff|fix, configured by cpp_format.yaml) and is far too slow to
      # put in front of every commit. Run it before sending a change up.
