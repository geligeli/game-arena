syntax = "proto3";

package tournament_arena.proto;

// What a problem is, as data: one server runs one, loaded from a .textproto by
// server/problem_config.h. A problem is either graded or played.

// Cheap checks before anything is stored; the sandbox is the security boundary.
message SubmissionPolicy {
  uint64 max_patch_bytes = 1;
  uint32 max_files = 2;
  uint32 max_hunks = 3;

  // Globs over touched paths: a path must match an allow entry (empty allows
  // all) and no deny entry. Not containment: a BUILD file can run a genrule.
  repeated string allow_paths = 4;
  repeated string deny_paths = 5;

  // Where plain-file submissions become an add-only patch; empty: patches only.
  string files_submit_dir = 6;

  // Required for files_submit_dir; a patch brings its own BUILD.
  CandidateHarness harness = 7;

  // Label prefixes extra_deps may name; empty allows none.
  repeated string allowed_dep_prefixes = 8;
}

// The problem's labels for the BUILD generated around a structured submission.
message CandidateHarness {
  // Library every submission is compiled against.
  string api_dep = 1;

  // Provides main(); compiled per candidate so local_defines reach it.
  string main_src = 2;

  // Further deps of the generated bot binary.
  repeated string bot_deps = 3;

  // A local_define selecting the harness's game; empty when it serves one.
  string game_define = 4;

  // The generated cc_binary's name (empty: "bot"), for targets and argv.
  string binary_name = 5;
}

// Ends up in the kit, where a participant may change it: none of it enforces.
message KitSpec {
  // Under files_submit_dir; a participant's directory is first copied from it.
  string starter_dir = 5;

  // Off: a dependency the kit fetches but the sandbox cannot fails later.
  bool allow_network_builds = 4;
}

// Enforced by the coordinator on GetSource and on manifests' patches: the
// tournament's rule about reading, not secrecy from the operator.
message SourcePolicy {
  enum Visibility {
    ALL = 0;   // the default
    OWN = 1;   // only your own; reads are gated on your token
    NONE = 2;  // nobody's, your own included
  }
  Visibility visibility = 1;
}

message BuildSpec {
  // Built in order, "{submission_id}" substituted (as in grade.argv and
  // match.referee_target). A match's bot is the target naming it, or the first.
  repeated string targets = 1;
  // Extra bazel flags, e.g. "--config=native".
  repeated string bazel_flags = 2;
  uint32 timeout_s = 3;
}

message SandboxSpec {
  // Holds the tree at /workspace and bazel matching .bazelversion; without
  // allow_build_network, also every dependency, vendored.
  string image = 1;

  // Caps on what runs the solution; the build has build.timeout_s instead.
  uint32 memory_limit_mb = 2;
  double cpus = 3;
  uint32 pids_limit = 4;

  // Off by default: a build that can fetch can exfiltrate.
  bool allow_build_network = 7;

  // e.g. "1000:1000"; empty is the image's default, often root.
  string run_as_user = 8;
}

message MetricSpec {
  string name = 1;  // key in the report, e.g. "wall_ms"
  enum Direction {
    MINIMIZE = 0;
    MAXIMIZE = 1;
  }
  Direction direction = 2;
  // The metric the leaderboard ranks by; exactly one must set it.
  bool primary = 3;
}

// Run the solution and read numbers off it (see MetricReport).
message GradeSpec {
  // argv run inside the sandbox, at the workspace root.
  repeated string argv = 1;

  // Runs; their aggregate is the score.
  uint32 repeats = 2;
  enum Aggregate {
    MIN = 0;  // best of N -- the usual choice for a timing
    MEDIAN = 1;
    MEAN = 2;
  }
  Aggregate aggregate = 3;

  repeated MetricSpec metrics = 4;

  // Only workers of this machine class; empty accepts any.
  string require_machine_class = 5;

  uint32 timeout_s = 6;
}

// {"metrics": {"wall_ms": 1234.5}} at $ARENA_REPORT, or a "RESULT k=v" stdout
// line. Keys not in GradeSpec.metrics are ignored, not rejected.
message MetricReport {
  map<string, double> metrics = 1;
}

// Play against others; the referee owns the rules, never the coordinator.
message MatchSpec {
  // Key into the referee's game registry.
  string game = 1;
  // Bazel label of the referee binary, built from the same patched tree.
  string referee_target = 2;

  uint32 games_per_order = 3;
  // e.g. "builtin:random"; a ladder of rated rivals follows them.
  repeated string placement_opponents = 4;

  uint32 turn_timeout_ms = 5;
  // Per seat per game; 0 leaves turn_timeout_ms, which alone bounds nothing.
  uint32 game_time_budget_ms = 6;
  uint32 max_moves_per_game = 7;
  uint32 timeout_s = 8;
  reserved 11;
  reserved "max_view_bytes";

  // Opaque, for the referee's registry, which ignores keys it does not know.
  map<string, string> registry_options = 10;
}

message RankingSpec {
  enum Kind {
    ELO = 0;     // requires MatchSpec
    METRIC = 1;  // requires GradeSpec
  }
  Kind kind = 1;
  // For METRIC; empty uses the GradeSpec metric marked primary.
  string metric_name = 2;
}

// Defaults; server/client_registry.h overrides them per client.
message ClientQuota {
  // One is the point: a client waits for a result before its next guess.
  uint32 max_active_evaluations = 1;
  // Outstanding jobs, rematches included.
  uint32 max_queued_jobs = 2;
}

message ClientPolicy {
  ClientQuota default_quota = 1;
}

message ProblemConfig {
  // Stable identifier, also the standings key. One server, one problem_id.
  string problem_id = 1;
  string display_name = 2;
  // Markdown, served to agents and shown atop the leaderboard.
  string description = 3;

  SubmissionPolicy submission = 5;
  BuildSpec build = 6;
  SandboxSpec sandbox = 7;

  oneof evaluation {
    GradeSpec grade = 8;
    MatchSpec match = 9;
  }

  RankingSpec ranking = 10;
  ClientPolicy clients = 11;
  // Absent means ALL.
  SourcePolicy source = 12;
  // Absent is a workable default.
  KitSpec kit = 13;
}
