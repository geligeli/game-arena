syntax = "proto3";

package tournament_arena.proto;

// The coordinator's two services: Arena for participants, SandboxFleet for the
// workers that dial in to build and run submissions.

service Arena {
  // Queues the candidate's build and its placement series.
  rpc Submit(SubmitRequest) returns (SubmitResponse);

  // Manifest only; use GetSource for file contents.
  rpc GetCandidate(GetCandidateRequest) returns (Candidate);

  // Gated by ProblemInfo.source_visibility, as are a manifest's patch bytes.
  rpc GetSource(GetSourceRequest) returns (SourceFile);

  rpc ListCandidates(ListCandidatesRequest) returns (ListCandidatesResponse);

  rpc GetJob(GetJobRequest) returns (Job);

  rpc Leaderboard(LeaderboardRequest) returns (LeaderboardResponse);

  rpc GetProblem(GetProblemRequest) returns (ProblemInfo);
}

message GetProblemRequest {}

// The part of ProblemConfig a submitter needs.
message ProblemInfo {
  string problem_id = 1;
  string display_name = 2;
  // Markdown.
  string description = 3;
  // True: submissions are run and measured, not played and rated.
  bool graded = 5;
  // "elo", "trueskill", or the ranked metric's name.
  string score_label = 6;
  // For a graded problem, whether lower or higher wins.
  bool lower_is_better = 7;

  uint64 max_patch_bytes = 8;
  uint32 max_files = 9;
  uint32 max_hunks = 10;
  repeated string allow_paths = 11;
  repeated string deny_paths = 12;
  // Dir for structured submissions (files + entry_header); empty: patches only.
  string files_submit_dir = 13;

  // The problem's SourcePolicy, flattened.
  enum SourceVisibility {
    SOURCE_ALL = 0;   // any candidate's files
    SOURCE_OWN = 1;   // only your own; reads need your token
    SOURCE_NONE = 2;  // nobody's
  }
  SourceVisibility source_visibility = 14;
}

service SandboxFleet {
  // One stream per worker, opened with `hello`; orders are pushed back on it.
  rpc Attach(stream WorkerMessage) returns (stream FleetMessage);
}

message SourceFile {
  // Relative to the candidate's own directory; never absolute or "..".
  string path = 1;
  bytes content = 2;
}

message Candidate {
  // Also the player_name its games and ratings are keyed by.
  string candidate_id = 1;
  string display_name = 2;
  string author = 3;  // the agent that submitted it
  string game = 4;

  string parent_id = 5;  // the candidate this one was derived from, if any
  string notes = 6;

  // A unified diff against the problem's tree, whichever form was submitted.
  bytes patch = 15;
  repeated string touched_paths = 16;

  // As submitted, for display; |patch| is what gets built.
  repeated string file_paths = 8;
  string entry_header = 9;
  repeated string extra_deps = 10;
  map<string, string> params = 11;

  enum Status {
    PENDING = 0;  // stored, waiting for a worker
    BUILDING = 1;
    READY = 2;  // built, playing or played
    BUILD_FAILED = 3;
    DISABLED = 4;  // withdrawn, or retired for misbehaving
  }
  Status status = 12;
  // Compact compiler errors on BUILD_FAILED, trimmed by the worker.
  string build_error = 13;
  int64 submitted_unix_ms = 14;
}

message SubmitRequest {
  string display_name = 1;
  string author = 2;
  string game = 3;
  string parent_id = 4;
  string notes = 5;

  // A unified diff against the problem's tree.
  bytes patch = 10;

  // Or new files under files_submit_dir, made into a patch by the server.
  // Ignored when |patch| is set.
  repeated SourceFile files = 6;
  string entry_header = 7;
  repeated string extra_deps = 8;

  map<string, string> params = 9;

  // Abort this client's in-flight jobs rather than be refused over quota.
  bool cancel_running = 11;
}

message SubmitResponse {
  string candidate_id = 1;
  // The build and placement job, for GetJob.
  string job_id = 2;
  // Jobs aborted for cancel_running; they end CANCELLED.
  repeated string superseded_job_ids = 3;
}

message GetCandidateRequest {
  string candidate_id = 1;
}

message GetSourceRequest {
  string candidate_id = 1;
  string path = 2;
}

message ListCandidatesRequest {
  string game = 1;    // empty: all games
  string author = 2;  // empty: all authors
  int32 limit = 3;    // 0: server default
  enum Order {
    // By whatever this problem ranks by, best first.
    BEST_FIRST = 0;
    NEWEST = 1;
  }
  Order order = 4;
}

message CandidateStanding {
  Candidate candidate = 1;

  // ELO, TrueSkill's mu - 3 sigma or the primary metric;
  // LeaderboardResponse.score_label says which.
  double score = 2;

  // Match problems.
  int32 wins = 3;
  int32 draws = 4;
  int32 losses = 5;

  // Graded problems: every metric, and the host that measured them.
  map<string, double> metrics = 6;
  string worker_id = 7;
  string machine_class = 8;
  int32 runs = 9;
}

message ListCandidatesResponse {
  repeated CandidateStanding candidates = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message Job {
  string job_id = 1;
  string candidate_id = 2;

  enum State {
    QUEUED = 0;
    RUNNING = 1;
    DONE = 2;
    FAILED = 3;
    // Replaced by a newer submission, which is not a failure.
    CANCELLED = 4;
  }
  State state = 3;

  // Why a build or an order failed, trimmed.
  string error = 4;

  int32 games_requested = 5;
  int32 games_played = 6;
  int32 wins = 7;
  int32 draws = 8;
  int32 losses = 9;
  double elo = 10;

  int64 created_unix_ms = 11;
  int64 finished_unix_ms = 12;

  // The last phase a worker reported; unset before the first.
  OrderProgress.Phase phase = 13;
}

message LeaderboardRequest {
  int32 limit = 2;
}

message LeaderboardResponse {
  repeated CandidateStanding rows = 1;
  // What `score` means here, e.g. "elo", "trueskill" or "wall_ms".
  string score_label = 2;
  // A measured metric (runs, machine) rather than a match record (W/D/L).
  bool graded = 3;
}

message WorkerHello {
  // Stable across reconnects.
  string worker_id = 1;
  int32 slots = 2;  // orders it will run concurrently
  // e.g. "bench-c7i", for GradeSpec.require_machine_class.
  string machine_class = 5;
}

// One buildable side of an order.
message Side {
  string candidate_id = 1;

  // Unified diff against the image's tree, applied in the sandbox.
  bytes patch = 2;

  // With "{submission_id}" already expanded.
  repeated string build_targets = 3;

  // The label of the bot binary; empty for a graded order.
  string bot_target = 4;

  map<string, string> params = 5;
}

message WorkOrder {
  string order_id = 1;
  string job_id = 2;
  string game = 4;

  Side candidate = 3;

  // "builtin:<spec>" or "player:<candidate_id>".
  string opponent_spec = 10;

  // A "player:" opponent's side. Both patches go onto one tree, so they must
  // touch disjoint paths.
  Side opponent = 16;

  int32 num_games = 11;
  int32 build_timeout_s = 13;
  int32 run_timeout_s = 14;

  // ProblemConfig.match.referee_target; empty for a graded order.
  string referee_target = 15;

  // Below run_timeout_s, so a stuck match reports a partial tally.
  int32 match_deadline_s = 17;

  SandboxOrder sandbox = 21;

  // From the problem's BuildSpec, e.g. "--config=native".
  repeated string bazel_flags = 23;

  // From ProblemConfig.match.
  uint32 turn_timeout_ms = 24;
  uint32 game_time_budget_ms = 25;
  uint32 max_moves_per_game = 26;
  reserved 27;
  reserved "max_view_bytes";

  // ProblemConfig.match.registry_options, forwarded verbatim to the referee.
  map<string, string> registry_options = 20;

  // A graded order runs this instead of playing.
  GradeOrder grade = 18;
}

message GradeOrder {
  // Run at the workspace root, "{submission_id}" already expanded.
  repeated string argv = 1;
  // Measurement runs; the aggregate over them is the score.
  int32 repeats = 2;
  enum Aggregate {
    MIN = 0;
    MEDIAN = 1;
    MEAN = 2;
  }
  Aggregate aggregate = 3;
  // Kept from a report; its other metrics are dropped.
  repeated string metric_names = 4;
  int32 timeout_s = 5;
  // Refuse the order unless the worker reports this machine class.
  string require_machine_class = 6;
}

// ProblemConfig.sandbox, flattened so a worker needs no problem schema. On the
// order, not the worker: two ratings compare only if built in the same image.
message SandboxOrder {
  // Required by the coordinator; a worker refuses an order without one.
  string image = 1;

  uint32 memory_limit_mb = 2;
  double cpus = 3;
  uint32 pids_limit = 4;
  string run_as_user = 5;
  uint32 build_memory_limit_mb = 8;

  // A build that can fetch can exfiltrate: a submitted genrule is any code.
  bool allow_build_network = 7;
}

message CancelOrder {
  string order_id = 1;
}

message OrderProgress {
  string order_id = 1;
  enum Phase {
    PREPARING = 0;
    BUILDING = 1;
    RUNNING = 2;
  }
  Phase phase = 2;
}

message OrderResult {
  string order_id = 1;
  bool build_ok = 2;
  // Compacted on the worker to the lines that matter.
  string build_log = 3;
  int32 games_played = 4;
  int32 wins = 5;
  int32 draws = 6;
  int32 losses = 7;
  // Set when the order could not complete at all (a crash, a timeout).
  string error = 9;

  // Whose build broke, when build_ok is false: an order builds both sides.
  string build_failed_candidate_id = 10;

  // A graded order's, keyed by GradeSpec.metrics names, and who measured them.
  map<string, double> metrics = 11;
  string worker_id = 12;
  string machine_class = 13;
  // The build's last 64 KiB; bytes, as the tail can split a UTF-8 character.
  bytes build_output = 14;
}

// Sent one per game before the result, which could outgrow a gRPC message.
message OrderGame {
  string order_id = 1;
  // A serialized tournament_broker.proto.GameRecord.
  bytes record = 2;
}

message WorkerMessage {
  oneof msg {
    WorkerHello hello = 1;
    OrderProgress progress = 2;
    OrderResult result = 3;
    // 4 was Heartbeat.
    OrderGame game = 5;
  }
}

message FleetMessage {
  oneof msg {
    WorkOrder order = 1;
    CancelOrder cancel = 2;
  }
}

// Not RPC: <data_dir>/metrics.pb, one per submission.
message MetricRecord {
  string candidate_id = 1;
  map<string, double> metrics = 2;
  string worker_id = 3;
  string machine_class = 4;
  int64 measured_unix_ms = 5;
  int32 runs = 6;  // the aggregate was taken over
}

message MetricStore {
  map<string, MetricRecord> records = 1;  // key: candidate_id
}

// Not RPC: <data_dir>/candidates/<candidate_id>/manifest.pb.
message CandidateManifest {
  Candidate candidate = 1;
}
