syntax = "proto3";

package tournament_arena.proto;

import "game_arena/proto/problem.proto";

// Who may submit, and how much; unlike ProblemConfig, never published. Clients
// are minted by arena_admin, and only a token's hash is stored.

message Client {
  // Stable; a submission's author comes from the token, never self-reported.
  string client_id = 1;
  string display_name = 2;
  // Lowercase hex SHA-256 of the token; the raw token never touches disk.
  string token_sha256 = 3;
  // Refuses new work but keeps the id and the submissions it authored.
  bool disabled = 4;
  // Overrides the problem's defaults; unset fields fall back.
  ClientQuota quota = 5;
}

message ClientRegistry {
  repeated Client clients = 1;
}
