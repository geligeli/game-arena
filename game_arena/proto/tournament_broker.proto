syntax = "proto3";

package tournament_broker.proto;

// Game-agnostic: states and actions travel as opaque bytes.

service TournamentBroker {
  // One game per stream: `hello` first, then `game_start`, `your_turn`s each
  // answered with an `action`, and `game_over`, after which the server closes.
  rpc Play(stream ClientMessage) returns (stream ServerMessage);
}

message Hello {
  string player_name = 1;  // identity, used for ELO and the leaderboard
  string game = 2;         // game registry key
  // "builtin:<spec>", or "player:<name>" to pair with the player naming this
  // one (a no-show times out). Either way seats alternate across the games
  // the two sides play each other.
  string opponent = 3;
}

message ActionMsg {
  bytes action = 1;  // serialized action
}

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    ActionMsg action = 2;
  }
}

message GameStart {
  string game_id = 1;
  int32 seat = 2;  // this connection's player index (0 or 1)
  string opponent_name = 3;
  bytes initial_state = 4;  // serialized state
}

message YourTurn {
  bytes state = 1;  // serialized state; your seat moves
  uint64 move_number = 2;
  int64 deadline_unix_ms = 3;  // server-side wall-clock turn deadline
}

message GameOver {
  enum Result {
    WIN = 0;   // from this connection's perspective
    LOSS = 1;
    DRAW = 2;
  }
  Result result = 1;
  // "normal" | "timeout" | "time_budget" | "opponent_disconnect" |
  // "illegal_action" | "max_moves" | "time_tiebreak"
  string reason = 2;
}

message ServerMessage {
  oneof msg {
    GameStart game_start = 1;
    YourTurn your_turn = 2;
    GameOver game_over = 3;
  }
}

// One finished game: <data_dir>/games/<game_id>.pb, and in a MatchReport.
message GameRecord {
  string game_id = 1;
  string game = 2;
  repeated string player_names = 3;  // indexed by seat
  bytes initial_state = 4;
  // RenderState() of the initial state, as Step.view is after each step: what
  // a replay shows.
  bytes initial_view = 11;
  reserved 12;
  reserved "views_cut_at";

  message Step {
    int32 player = 1;    // deciding player; -1 for chance resolutions
    bytes action = 2;    // serialized action
    int64 unix_ms = 3;
    bytes view = 4;     // empty: unchanged
    bytes caption = 5;  // RenderLastStep(); empty: show the action
  }
  repeated Step steps = 5;

  enum Result {
    ONGOING = 0;
    DRAW = 1;
    WIN = 2;
  }
  Result result = 6;
  int32 winning_player = 7;  // meaningful iff result == WIN
  string termination_reason = 8;  // same vocabulary as GameOver.reason
  int64 started_unix_ms = 9;
  int64 finished_unix_ms = 10;
}

// What a referee leaves at --report; the tally is counted from it.
message MatchReport {
  repeated GameRecord games = 1;
}

// <data_dir>/ratings.pb.
message RatingStore {
  map<string, Rating> ratings = 1;  // key: game + "\t" + player_name
}

message Rating {
  double elo = 1;
  int32 wins = 2;
  int32 draws = 3;
  int32 losses = 4;
}
