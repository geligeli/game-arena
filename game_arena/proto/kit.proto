syntax = "proto3";

package tournament_arena.proto;

// A kit's arena.textproto: arena_cli's defaults, from $ARENA_KIT or the nearest
// enclosing directory. Yours to edit: the coordinator enforces its own policy.
message KitConfig {
  // host:port of the Arena service; $ARENA_SERVER overrides it, --server both.
  string server = 2;
  // Display only: the coordinator takes the author from the token.
  string client_id = 4;

  // Yours is <submit_dir>/<your name>; `source <name>` puts a rival's by it.
  string submit_dir = 9;
  // The directory yours is copied from the first time, relative to the kit.
  string starter_dir = 10;

  // For `spar`: the binary a participant's directory builds, the referee's
  // game (empty: graded, no spar) and flags bounding a game like a rated one.
  string bot_binary = 11;
  string game = 12;
  repeated string referee_flags = 13;
  int32 players = 14;  // seats per game; 0 is 2
}
