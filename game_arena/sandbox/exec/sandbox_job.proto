syntax = "proto3";

// A job for sandbox/exec: it names no order, candidate or game.
package sandbox_exec.proto;

message Tmpfs {
  string target = 1;   // "/tmp"
  string options = 2;  // "exec"; empty leaves the engine's default
}

// Zero is hardened: a loosening field is a relaxation, so a field added later
// cannot weaken a caller written before it.
message Isolation {
  string image = 1;  // container engines only

  uint32 memory_limit_mb = 2;  // 0: unlimited
  double cpus = 3;             // 0: unlimited
  uint32 pids_limit = 4;       // 0: unlimited
  string run_as_user = 5;      // "1000:1000"; empty: the image's default

  enum Network {
    NETWORK_NONE = 0;
    NETWORK_PHASE_BRIDGE = 1;  // the phase's steps reach each other, no egress
    NETWORK_EGRESS = 2;        // a build that can fetch can also exfiltrate
  }
  Network network = 6;

  bool writable_rootfs = 7;               // false -> --read-only
  bool keep_default_caps = 8;             // false -> --cap-drop ALL
  bool allow_new_privileges = 9;          // false -> no-new-privileges
  repeated string add_capabilities = 10;  // on top of the drop
  repeated Tmpfs tmpfs = 11;
  uint64 address_space_limit_bytes = 12;  // process engines: RLIMIT_AS
}

message Mount {
  enum Kind {
    BIND = 0;  // a path as the daemon resolves it; a host's opt-in for caches
    VOLUME = 1;
  }
  Kind kind = 4;
  string source = 1;  // BIND: a host path; VOLUME: the volume's name
  string target = 2;  // inside the sandbox
  bool readonly = 3;
}

message StagedFile {
  string path = 1;  // relative, with no "." or ".." component
  bytes content = 2;
}

message Workspace {
  string tree_dir = 2;     // process engines only
  string git = 4;          // empty -> "git"
  string scratch_dir = 6;  // process engines; a container's is a volume

  string staging_dir = 10;  // engine-local; where staged_files are written
  repeated StagedFile staged_files = 11;

  enum Patch {
    PATCH_NONE = 0;
    PATCH_HOST = 1;  // git apply in tree_dir before any step; process engines
    PATCH_IN_ENTRYPOINT = 2;  // git apply from /patches, mounted read-only
  }
  Patch patch = 12;
  repeated string patch_files = 13;  // names under staging_dir, in order

  repeated Mount mounts = 14;    // every step's
  string sandbox_work_dir = 15;  // cwd for every step; empty -> the tree root
}

message Endpoint {
  // The step writes its bound port to {{port_file}}; the phase waits for it.
  bool discover_via_port_file = 2;
  int32 discover_timeout_s = 3;  // 0 -> 60
}

message Token {
  string text = 1;
  bool verbatim = 2;  // unquoted in the shell entrypoint; never for data
}

message Step {
  string name = 1;  // log tag, sandbox-name suffix and {{peer:<name>}}
  repeated Token argv = 2;
  map<string, string> env = 4;  // exported in a script; execve env otherwise
  string cwd = 5;               // empty -> Workspace.sandbox_work_dir
  int32 timeout_s = 6;          // 0: no limit

  Isolation isolation = 7;  // overrides the phase's
  Endpoint endpoint = 8;    // set when other steps of the phase dial this one

  repeated string collect_files = 9;  // under {{scratch}}, into collected
  bool keep_after_exit = 10;  // so its output can still be asked for

  // This step's only: what the build caches, what it built must not see.
  repeated Mount mounts = 12;

  // PATCH_IN_ENTRYPOINT only; later steps see the patched workspace volume.
  bool applies_patches = 11;

  // Its own {{scratch}}, so other steps cannot forge what it leaves there.
  bool private_scratch = 13;
}

message Phase {
  string name = 1;
  repeated Step background = 2;  // started first; an Endpoint is waited for
  Step foreground = 3;           // its exit ends the phase
  Isolation isolation = 4;       // default for every step of the phase
  int32 drain_timeout_s = 5;     // wait on the background steps; 0 -> 60
}

message Job {
  string id = 1;  // opaque; the cancel handle and every sandbox's name prefix
  Workspace workspace = 2;
  Isolation isolation = 3;    // default for every phase
  repeated Phase phases = 4;  // in order; the first failure stops the job
  string log_dir = 5;         // engine-local; captured output lands here
}

// Why the engine could not run the job; a step that ran and failed is OK.
message Status {
  enum Code {
    OK = 0;
    INVALID_JOB = 1;       // no phases, no image, a staged path that escapes
    TOOL_MISSING = 2;      // the docker/git binary could not be run
    WORKSPACE_FAILED = 3;  // staging, patch, load
    NETWORK_FAILED = 4;    // the phase bridge could not be created
    START_FAILED = 5;      // the sandbox would not start
    ENDPOINT_FAILED = 6;   // a peer never published an address
    CANCELLED = 7;
  }
  Code code = 1;
  string message = 2;  // human text, already trimmed
}

message StepResult {
  string name = 1;
  bool started = 2;     // false: the engine never got it running
  int32 exit_code = 3;  // 124 on the engine's timeout, as timeout(1) does
  bool timed_out = 4;
  int32 timeout_s = 5;  // what the engine actually enforced
  string stdout = 6;
  string stderr = 7;
  map<string, bytes> collected = 8;
}

message PhaseResult {
  string name = 1;
  repeated StepResult steps = 2;  // the foreground first, then the background
}

message JobResult {
  Status status = 1;
  repeated PhaseResult phases = 2;
}
