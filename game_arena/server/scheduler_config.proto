syntax = "proto2";

package tournament_arena;

import "game_arena/proto/arena.proto";

// From the problem config (SchedulerConfigFor). Coordinator-only.
message SchedulerConfig {
  // Every order starts as a copy; grade.argv still has "{submission_id}".
  optional proto.WorkOrder order = 17;
  // Still carrying "{submission_id}", expanded per submission.
  repeated string build_targets = 3;
  // Likewise templated. Empty for a graded problem.
  optional string bot_target = 4;
  repeated string placement_opponents = 12;
  optional int32 placement_games = 13 [default = 4];
  // Orders of rated rivals a placement also plays, spread across the board.
  optional int32 ladder_size = 14 [default = 3];
  // Seats per game: an order plays players - 1 opponents together.
  optional int32 players = 18 [default = 2];
}
